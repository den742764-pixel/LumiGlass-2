name: Import official Telegram Android source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Check out LumiGlass-2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve import workflow
        run: |
          mkdir -p /tmp/lumi-workflows
          cp .github/workflows/import-telegram.yml /tmp/lumi-workflows/import-telegram.yml

      - name: Clone official Telegram Android source
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git /tmp/telegram-android

      - name: Import source into LumiGlass-2
        run: |
          cp -a /tmp/telegram-android/. .
          mkdir -p .github/workflows
          cp /tmp/lumi-workflows/import-telegram.yml .github/workflows/import-telegram.yml
          rm -rf .git

      - name: Commit imported source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git branch -M main
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import official Telegram Android source"
          git push --force origin main
